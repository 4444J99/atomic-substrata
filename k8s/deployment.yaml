apiVersion: v1
kind: Namespace
metadata:
  name: uaks
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: uaks-config
  namespace: uaks
data:
  DATA_DIR: "/data"
  PYTHONUNBUFFERED: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uaks-api
  namespace: uaks
spec:
  replicas: 2
  selector:
    matchLabels:
      app: uaks-api
  template:
    metadata:
      labels:
        app: uaks-api
    spec:
      containers:
      - name: uaks-api
        image: uaks:latest
        ports:
        - containerPort: 8080
        env:
        - name: SEMANTIC_SCHOLAR_API_KEY
          valueFrom:
            secretKeyRef:
              name: uaks-secrets
              key: semantic-scholar-api-key
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: uaks-data
          mountPath: /data
      volumes:
      - name: uaks-data
        persistentVolumeClaim:
          claimName: uaks-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: uaks-api
  namespace: uaks
spec:
  selector:
    app: uaks-api
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uaks-pvc
  namespace: uaks
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uaks-ingress
  namespace: uaks
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: uaks.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: uaks-api
            port:
              number: 80
