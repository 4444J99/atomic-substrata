version: '3.8'

services:
  uaks-api:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  uaks-mcp:
    build: .
    command: python -m academic_mcp
    volumes:
      - ./data:/app/data
    environment:
      - SEMANTIC_SCHOLAR_API_KEY=${SEMANTIC_SCHOLAR_API_KEY:-}
    restart: unless-stopped

networks:
  default:
    name: uaks-network
